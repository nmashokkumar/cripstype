services:
  crisptype-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crisptype-dictation-server
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - crisptype-model-cache:/home/crisptype/.cache/huggingface

volumes:
  crisptype-model-cache:
