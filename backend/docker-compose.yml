services:
  flow-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flow-dictation-server
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - flow-model-cache:/root/.cache/huggingface

volumes:
  flow-model-cache:
