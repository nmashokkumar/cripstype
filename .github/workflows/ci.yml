name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-tests:
    name: Typecheck, Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run unit & integration tests
        run: npm test

      - name: Build web frontend
        run: npm run build

  backend-syntax:
    name: Python Backend Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile-check Python backend modules
        run: python3 -m py_compile backend/app/*.py backend/keep_alive.py
